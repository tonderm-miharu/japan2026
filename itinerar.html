<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japan 2026 | Itinerář</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23fff' stroke='%23ddd' stroke-width='2'/><circle cx='50' cy='50' r='24' fill='%23bc002d'/></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'DSEG7';
            src: url('https://cdn.jsdelivr.net/npm/dseg@0.46.0/fonts/DSEG7-Classic/DSEG7Classic-Bold.woff2') format('woff2');
        }
    </style>
        <style>
        :root {
            --bg: #0a0a0a;
            --bg-card: #141414;
            --bg-hover: #1a1a1a;
            --text: #f5f5f5;
            --text-dim: #888;
            --text-muted: #555;
            --accent: #3b82f6;
            --red: #ef4444;
            --orange: #f59e0b;
            --green: #10b981;
            --purple: #8b5cf6;
            --pink: #ec4899;
            --cyan: #06b6d4;
            --border: #222;
            --radius: 12px;
            --radius-sm: 8px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10,10,10,0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
        }

        .header-inner {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo h1 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .header-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-wrap: wrap;
        }

        .nav-buttons {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-dim);
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }

        .nav-btn:hover { border-color: var(--text-dim); color: var(--text); background: var(--bg-hover); }
        .nav-btn-icon { font-size: 1rem; }

        @media (max-width: 700px) {
            .nav-btn-label { display: none; }
            .nav-btn { padding: 8px; }
        }

        .filter-row {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 6px 10px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-dim);
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .filter-btn:hover { border-color: var(--text-dim); color: var(--text); }
        .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

        .filter-icon { width: 14px; height: 14px; display: none; }
        .filter-text { }

        @media (max-width: 900px) {
            .filter-icon {
                display: block;
                width: 28px;
                height: 28px;
                stroke: #60a5fa;
                filter: drop-shadow(0 0 4px #60a5fa) drop-shadow(0 0 8px #3b82f6);
            }
            .filter-text { display: none; }
            .filter-btn { padding: 6px 8px; }
            .filter-btn[data-filter="ho"] {
                color: #60a5fa;
                text-shadow: 0 0 4px #60a5fa, 0 0 8px #3b82f6;
                font-size: 1.4rem;
                font-weight: 700;
                padding: 4px 10px;
            }
            .nav-btn .nav-btn-icon {
                color: #60a5fa;
                text-shadow: 0 0 4px #60a5fa, 0 0 8px #3b82f6;
                font-size: 1.5rem;
                transform: scaleX(1.8);
                display: inline-block;
            }
        }

        .view-row {
            display: flex;
            gap: 4px;
            margin-left: 12px;
        }

        .view-btn {
            padding: 6px 10px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-dim);
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }

        .view-btn:hover { border-color: var(--text-dim); color: var(--text); }

        @media (max-width: 900px) {
            .view-row { display: none; }
        }

        @media (min-width: 901px) {
            .menu-container { display: none; }
            .view-btn[data-modal="calendar"] { display: none; }
            .calendar-btn { display: none; }
        }

        .calendar-btn .filter-icon {
            display: block;
            width: 28px;
            height: 28px;
            stroke: #ef4444;
            filter: drop-shadow(0 0 4px #ef4444) drop-shadow(0 0 8px #dc2626);
        }

        .nav-search {
            padding: 6px 10px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
            font-size: 0.75rem;
            flex: 1;
            min-width: 60px;
            max-width: 200px;
            outline: none;
            transition: all 0.15s;
        }

        .nav-search:focus { border-color: var(--accent); }
        .nav-search::placeholder { color: var(--text-dim); }

        .mobile-search { display: none; margin: 0 10px; max-width: none; }

        @media (max-width: 900px) {
            .nav-search:not(.mobile-search) { display: none; }
            .mobile-search { display: block; flex: 1; }
            .header-top { gap: 8px; }
            .countdown { margin-left: 0; white-space: nowrap; }
        }

        .menu-container {
            position: relative;
        }

        .menu-dropdown {
            display: none;
            position: absolute;
            top: 40px;
            right: 0;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 8px;
            min-width: 180px;
            z-index: 150;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        .menu-dropdown.open { display: block; }

        .menu-item {
            display: block;
            width: 100%;
            padding: 10px 12px;
            border-radius: 6px;
            border: none;
            background: transparent;
            color: var(--text);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.15s;
            text-align: left;
        }

        .menu-item:hover { background: var(--bg-hover); }

        main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px 20px;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 24px;
        }

        @media (max-width: 900px) {
            main { grid-template-columns: 1fr; padding-top: 12px; }
            .sidebar { display: none; }
        }

        .sidebar {
            position: sticky;
            top: 80px;
            height: fit-content;
        }

        @media (max-width: 900px) {
            .sidebar { display: none; }
        }

        .sidebar-section {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 16px;
        }

        .sidebar-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .phase-list { list-style: none; }

        .phase-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: background 0.15s;
            margin-bottom: 2px;
        }

        .phase-item:hover { background: var(--bg-hover); }

        .phase-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .phase-name { font-size: 0.85rem; flex: 1; }
        .phase-dates { font-size: 0.75rem; color: var(--text-muted); }

        .task-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.15);
        }

        .task-item:last-child { border-bottom: none; }

        .task-group-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: rgba(255,255,255,0.8);
            margin: 12px 0 6px 0;
            padding-bottom: 4px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }
        .task-group-title:first-child { margin-top: 0; }

        .task-item-compact {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 0;
        }

        .task-cb {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 4px;
            cursor: pointer;
            flex-shrink: 0;
            margin-top: 2px;
            transition: all 0.15s;
            background: transparent;
        }

        .task-cb:hover { border-color: #86efac; }
        .task-cb.done { background: #22c55e; border-color: #22c55e; }
        .task-cb.done::after { content: "✓"; color: #fff; font-size: 10px; display: flex; align-items: center; justify-content: center; height: 100%; }

        .task-text { font-size: 0.8rem; color: rgba(255,255,255,0.9); }
        .task-text.done { text-decoration: line-through; opacity: 0.5; }

        .task-priority {
            font-size: 0.6rem;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 4px;
            display: inline-block;
        }

        .priority-high { background: rgba(239,68,68,0.4); color: #fca5a5; }
        .priority-med { background: rgba(245,158,11,0.4); color: #fcd34d; }

        .days {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .day-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid transparent;
            overflow: hidden;
            transition: all 0.15s;
        }

        .day-card:hover { border-color: var(--border); }
        .day-card.expanded { border-color: var(--accent); }
        .day-card.hidden { display: none; }

        .day-head {
            display: grid;
            grid-template-columns: 48px 1fr auto auto 28px;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            .day-head {
                grid-template-columns: 52px 1fr 24px;
                gap: 10px;
                padding: 10px 12px;
            }
            .day-tags, .day-hotel { display: none !important; }
            .day-info h3 { font-size: 0.9rem; }
            .day-info p { font-size: 0.75rem; line-height: 1.3; }
            .day-num-box { min-width: 48px; height: 44px; }
            .day-n { font-size: 0.85rem; }
            .expand-btn { width: 24px; height: 24px; font-size: 0.6rem; }
        }

        .day-num-box {
            min-width: 52px;
            height: 48px;
            padding: 0 6px;
            border-radius: var(--radius-sm);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .day-n { font-size: 0.95rem; line-height: 1; white-space: nowrap; }
        .day-dow { font-size: 0.6rem; text-transform: uppercase; opacity: 0.8; }

        .day-info h3 { font-size: 0.95rem; font-weight: 600; margin-bottom: 2px; }
        .day-info p { font-size: 0.8rem; color: var(--text-dim); }
        .day-info small { font-size: 0.7rem; color: var(--text-muted); }

        .day-tags { display: flex; gap: 4px; flex-wrap: wrap; }

        .tag {
            font-size: 0.65rem;
            padding: 3px 8px;
            border-radius: 10px;
            font-weight: 500;
            text-transform: uppercase;
        }

        .tag-ho { background: rgba(239,68,68,0.15); color: var(--red); }
        .tag-car { background: rgba(59,130,246,0.15); color: var(--accent); }
        .tag-bike { background: rgba(16,185,129,0.15); color: var(--green); }
        .tag-onsen { background: rgba(245,158,11,0.15); color: var(--orange); }
        .tag-flight { background: rgba(139,92,246,0.15); color: var(--purple); }
        .tag-meet { background: rgba(236,72,153,0.15); color: var(--pink); }
        .tag-fest { background: rgba(6,182,212,0.15); color: var(--cyan); }

        .day-hotel { text-align: right; }
        .hotel-name { font-size: 0.75rem; color: var(--text-dim); max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .hotel-price { font-size: 0.8rem; font-weight: 600; color: var(--green); }

        .expand-btn {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--bg-hover);
            color: var(--text-dim);
            font-size: 0.7rem;
            transition: transform 0.2s;
        }

        .day-card.expanded .expand-btn { transform: rotate(180deg); }

        .day-body {
            display: none;
            padding: 0 16px 16px;
            border-top: 1px solid var(--border);
        }

        .day-card.expanded .day-body { display: block; }

        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 16px;
        }

        @media (max-width: 700px) { .detail-grid { grid-template-columns: 1fr; } }

        .detail-section {
            background: var(--bg-hover);
            border-radius: var(--radius-sm);
            padding: 12px;
        }

        .detail-title {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .timeline {
            position: relative;
            padding-left: 20px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 4px;
            top: 4px;
            bottom: 4px;
            width: 2px;
            background: var(--border);
        }

        .tl-item {
            position: relative;
            padding-bottom: 10px;
        }

        .tl-item:last-child { padding-bottom: 0; }

        .tl-dot {
            position: absolute;
            left: -20px;
            top: 4px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent);
            border: 2px solid var(--bg-hover);
        }

        .tl-dot.transport { background: var(--purple); }
        .tl-dot.food { background: var(--orange); }
        .tl-dot.sight { background: var(--green); }
        .tl-dot.work { background: var(--red); }

        .tl-time { font-size: 0.75rem; color: var(--accent); font-weight: 600; }
        .tl-text { font-size: 0.85rem; color: var(--text-dim); }
        .tl-note { font-size: 0.75rem; color: var(--text-muted); font-style: italic; }

        .hotel-card {
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }

        .hotel-card .name { font-size: 0.85rem; font-weight: 500; margin-bottom: 4px; }
        .hotel-card .meta { font-size: 0.75rem; color: var(--text-dim); }
        .hotel-card .price { font-size: 1rem; font-weight: 700; color: var(--green); }

        .hotel-badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
        .hotel-badge {
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }
        .badge-paid { background: rgba(16,185,129,0.15); color: var(--green); }
        .badge-onsite { background: rgba(245,158,11,0.15); color: var(--orange); }
        .badge-breakfast { background: rgba(59,130,246,0.15); color: var(--accent); }
        .badge-halfboard { background: rgba(139,92,246,0.15); color: var(--purple); }
        .badge-cancel { background: rgba(239,68,68,0.1); color: var(--red); }
        .badge-bonus { background: rgba(6,182,212,0.15); color: var(--cyan); }

        .badge-trip { background: rgba(0,104,201,0.2); color: #4DA3FF; }
        .badge-agoda { background: rgba(231,76,60,0.2); color: #FF6B5B; }
        .badge-booking { background: rgba(0,53,128,0.25); color: #5B9BFF; }
        .badge-japanican { background: rgba(220,53,69,0.2); color: #FF5C6C; }
        .badge-ikyu { background: rgba(50,50,50,0.3); color: #AAA; }
        .badge-revolut { background: rgba(139,92,246,0.2); color: #A78BFA; }
        .badge-hotelweb { background: rgba(100,100,100,0.2); color: #999; }

        /* Weather styles */
        .weather-inline {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-left: 8px;
            opacity: 0.8;
        }
        .weather-inline-icon { font-size: 1rem; }
        .weather-inline-temp { font-weight: 500; color: var(--text-dim); }
        .weather-badge {
            font-size: 0.6rem;
            padding: 2px 5px;
            border-radius: 3px;
            margin-left: 4px;
        }
        .weather-avg { background: rgba(100,100,100,0.3); color: #999; }
        .weather-live { background: rgba(16,185,129,0.2); color: var(--green); }
        .weather-detail {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: var(--bg-hover);
            border-radius: var(--radius-sm);
            margin-bottom: 12px;
        }
        .weather-detail-icon { font-size: 2.5rem; }
        .weather-detail-info { flex: 1; }
        .weather-detail-temp { font-size: 1.5rem; font-weight: 700; }
        .weather-detail-desc { font-size: 0.8rem; color: var(--text-dim); }
        .weather-detail-extra { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }

        .day-tasks-list { margin-top: 8px; }
        .day-task-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 0;
            font-size: 0.8rem;
            color: var(--text-dim);
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: opacity 0.15s;
        }
        .day-task-item:last-child { border-bottom: none; }
        .day-task-item:hover { opacity: 0.8; }
        .day-task-item.done { opacity: 0.5; text-decoration: line-through; }
        .day-task-cb {
            width: 16px;
            height: 16px;
            border: 2px solid var(--text-muted);
            border-radius: 4px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }
        .day-task-cb.done { background: var(--green); border-color: var(--green); }
        .day-task-cb.done::after { content: "✓"; color: #fff; font-size: 10px; }

        .poi-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: var(--accent);
            text-decoration: none;
            font-size: 0.75rem;
            opacity: 0.8;
            transition: opacity 0.15s;
        }
        .poi-link:hover { opacity: 1; text-decoration: underline; }
        .poi-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed var(--border);
        }

        .countdown {
            font-family: 'DSEG7', 'Orbitron', monospace;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-left: 12px;
        }
        .countdown.before {
            color: #fbbf24;
            text-shadow: 0 0 10px rgba(251,191,36,0.6), 0 0 20px rgba(251,191,36,0.3);
        }
        .countdown.after {
            color: var(--green);
            text-shadow: 0 0 10px rgba(16,185,129,0.6), 0 0 20px rgba(16,185,129,0.3);
        }
        .countdown.zero {
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.5), 0 0 20px rgba(255,255,255,0.3);
        }

        .countdown {
            display: inline-flex;
            align-items: center;
        }

        .digit-wrapper {
            height: 1.3em;
            overflow: hidden;
            display: inline-block;
        }

        .digit-roll {
            display: flex;
            flex-direction: column;
        }

        .digit-roll span {
            height: 1.3em;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .view-section {
            padding: 16px 0;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }
        .view-section:last-child { border-bottom: none; }
        .view-section h3 {
            font-size: 0.85rem;
            margin-bottom: 12px;
            color: #fff;
        }
        .view-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.9);
            border-bottom: 1px solid rgba(255,255,255,0.15);
        }
        .view-item:last-child { border-bottom: none; }
        .view-item-date { color: #fef08a; font-weight: 500; }
        .view-item-price { color: #86efac; font-weight: 600; }
        .view-total {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            font-size: 0.9rem;
            font-weight: 600;
            color: #fff;
            border-top: 2px solid rgba(255,255,255,0.3);
            margin-top: 8px;
        }

        
        /* Calendar */

    function getWeatherForDay(day) {
        const cached = JSON.parse(localStorage.getItem(WEATHER_CACHE_KEY) || '{}');
        if (cached[day] && cached[day].live) {
            return { ...cached[day], isLive: true };
        }
        const d = DAYS.find(x => x.day === day);
        if (!d) return null;
        const month = parseInt(d.date.split('.')[1]);
        const region = d.region || 'transit';
        const def = WEATHER_DEFAULTS[region]?.[month] || WEATHER_DEFAULTS.tokyo[10];
        return { ...def, isLive: false };
    }

    async function fetchWeatherForDay(day) {
        if (!OWM_API_KEY) return null;
        const d = DAYS.find(x => x.day === day);
        if (!d || !d.pois || !d.pois[0]) return null;

        const [lat, lon] = d.pois[0].coords;
        const dateStr = d.date.split('.').reverse().join('-').replace('-2026', '-2026');
        const targetDate = new Date(`2026-${d.date.split('.')[1].padStart(2,'0')}-${d.date.split('.')[0].padStart(2,'0')}`);
        const now = new Date();
        const daysAhead = Math.ceil((targetDate - now) / (1000 * 60 * 60 * 24));

        if (daysAhead > 5) return null; // OpenWeatherMap free tier = 5 days

        try {
            const res = await fetch(`https://api.openweathermap.org/data/2.5/forecast?lat=${lat}&lon=${lon}&units=metric&appid=${OWM_API_KEY}`);
            const data = await res.json();
            if (!data.list) return null;

            const dayData = data.list.find(item => {
                const itemDate = new Date(item.dt * 1000);
                return itemDate.toDateString() === targetDate.toDateString() && itemDate.getHours() >= 12;
            });

            if (!dayData) return null;

            const iconMap = { '01': '☀️', '02': '🌤️', '03': '⛅', '04': '☁️', '09': '🌧️', '10': '🌦️', '11': '⛈️', '13': '🌨️', '50': '🌫️' };
            const owmIcon = dayData.weather[0].icon.slice(0, 2);

            return {
                icon: iconMap[owmIcon] || '🌤️',
                temp: `${Math.round(dayData.main.temp)}°C`,
                tempMax: `${Math.round(dayData.main.temp_max)}°C`,
                desc: dayData.weather[0].description,
                humidity: dayData.main.humidity,
                wind: Math.round(dayData.wind.speed * 3.6),
                live: true
            };
        } catch (e) {
            console.error('Weather fetch error:', e);
            return null;
        }
    }

    function getDayBoxStyle(dow, tags, timeline) {
        const isWeekend = ['So', 'Ne'].includes(dow);
        const hasHO = tags.includes('ho');

        const baseStart = isWeekend ? '#2563eb' : '#059669';
        const baseEnd = isWeekend ? '#3b82f6' : '#10b981';
        const hoColor = '#dc2626';

        if (!hasHO) {
            return `background: linear-gradient(135deg, ${baseStart}, ${baseEnd});`;
        }

        let hoHours = 8;
        if (timeline) {
            const hoEntry = timeline.find(t => t.text && t.text.includes('HOME OFFICE'));
            if (hoEntry && hoEntry.time) {
                const match = hoEntry.time.match(/(\d+):00[–-](\d+):00/);
                if (match) {
                    hoHours = parseInt(match[2]) - parseInt(match[1]);
                }
            }
        }

        if (hoHours <= 4) {
            // Short HO - corner triangle
            return `background: linear-gradient(to bottom left, ${hoColor} 30%, transparent 30%), linear-gradient(135deg, ${baseStart}, ${baseEnd});`;
        }
        const hoPercent = hoHours >= 8 ? 50 : 40;
        const basePercent = 100 - hoPercent;

        return `background: linear-gradient(to right, ${baseStart} 0%, ${baseEnd} ${basePercent}%, ${hoColor} ${basePercent}%);`;
    }

        return `<span class="hotel-badge ${map[provider] || ''}">${provider}</span>`;
    }

    function renderTasks() {
        const containers = [document.getElementById('tasks'), document.getElementById('tasksMobile')];
        const saved = JSON.parse(localStorage.getItem('japan2026_tasks') || '{}');

        const highTasks = TASKS.filter(t => t.priority === 'high');
        const medTasks = TASKS.filter(t => t.priority === 'med');

        const renderGroup = (tasks, title) => {
            if (tasks.length === 0) return '';
            return `
                <div class="task-group-title">${title}</div>
                ${tasks.map(t => {
                    const done = saved[t.id] || false;
                    return `
                        <div class="task-item-compact">
                            <div class="task-cb ${done ? 'done' : ''}" data-task="${t.id}"></div>
                            <span class="task-text ${done ? 'done' : ''}">${t.text}</span>
                        </div>
                    `;
                }).join('')}
            `;
        };

        const html = renderGroup(highTasks, '🔴 High Priority') + renderGroup(medTasks, '🟡 Medium');

        containers.forEach(container => {
            if (!container) return;
            container.innerHTML = html;
            container.querySelectorAll('.task-cb').forEach(cb => {
                cb.addEventListener('click', () => {
                    const taskId = cb.dataset.task;
                    const saved = JSON.parse(localStorage.getItem('japan2026_tasks') || '{}');
                    saved[taskId] = !saved[taskId];
                    localStorage.setItem('japan2026_tasks', JSON.stringify(saved));
                    renderTasks();
                });
            });
        });
    }

    function renderDays() {
        const container = document.getElementById('days');
        container.innerHTML = DAYS.map(d => {
            const tagsHtml = d.tags.map(t => `<span class="tag ${getTagClass(t)}">${getTagLabel(t)}</span>`).join('');
            const timelineHtml = d.timeline ? d.timeline.map(tl => `
                <div class="tl-item">
                    <div class="tl-dot ${getDotClass(tl.type)}"></div>
                    ${tl.time ? `<div class="tl-time">${tl.time}</div>` : ''}
                    <div class="tl-text">${tl.text}</div>
                    ${tl.note ? `<div class="tl-note">${tl.note}</div>` : ''}
                </div>
            `).join('') : '';

            const weather = getWeatherForDay(d.day);
            const weatherInline = weather && weather.temp !== '–' ? `<span class="weather-inline"><span class="weather-inline-icon">${weather.icon}</span><span class="weather-inline-temp">${weather.temp.split('-').pop()}</span></span>` : '';
            const weatherDetail = weather ? `
                <div class="weather-detail">
                    <span class="weather-detail-icon">${weather.icon}</span>
                    <div class="weather-detail-info">
                        <div class="weather-detail-temp">${weather.temp} <span class="weather-badge ${weather.isLive ? 'weather-live' : 'weather-avg'}">${weather.isLive ? 'předpověď' : 'průměr'}</span></div>
                        <div class="weather-detail-desc">${weather.desc}</div>
                        ${weather.isLive && weather.wind ? `<div class="weather-detail-extra">💨 ${weather.wind} km/h | 💧 ${weather.humidity}%</div>` : ''}
                    </div>
                </div>
            ` : '';

            return `
                <div class="day-card" id="day-${d.day}" data-tags="${d.tags.join(' ')}" data-search="${(d.title + ' ' + d.subtitle + ' ' + d.hotel).toLowerCase()}">
                    <div class="day-head">
                        <div class="day-num-box" style="${getDayBoxStyle(d.dow, d.tags, d.timeline)}">
                            <span class="day-n">${d.date.replace('.2026', '')}</span>
                            <span class="day-dow">${d.dow}</span>
                        </div>
                        <div class="day-info">
                            <h3>${LOCATIONS[d.day] || d.title}${weatherInline}</h3>
                            <p>${d.title}${d.subtitle ? ' – ' + d.subtitle : ''}</p>
                        </div>
                        <div class="day-tags">${tagsHtml}</div>
                        <div class="day-hotel">
                            <div class="hotel-name">${d.hotel}</div>
                            ${d.price ? `<div class="hotel-price">${d.price}</div>` : ''}
                        </div>
                        <div class="expand-btn">▼</div>
                    </div>
                    <div class="day-body">
                        ${weatherDetail}
                        <div class="detail-grid">
                            <div class="detail-section">
                                <div class="detail-title">Program</div>
                                <div class="timeline">${timelineHtml}</div>
                            </div>
                            <div class="detail-section">
                                <div class="detail-title">Ubytování</div>
                                <div class="hotel-card">
                                    <div>
                                        <div class="name">${d.hotel}</div>
                                        ${d.note ? `<div class="meta" style="margin-top:4px;color:var(--orange)">${d.note}</div>` : ''}
                                        <div class="hotel-badges">
                                            ${getProviderBadge(HOTEL_INFO[d.day]?.provider)}
                                            ${HOTEL_INFO[d.day]?.payment === 'paid' ? '<span class="hotel-badge badge-paid">✓ Paid</span>' : ''}
                                            ${HOTEL_INFO[d.day]?.payment === 'on-site' ? '<span class="hotel-badge badge-onsite">$ On-site</span>' : ''}
                                            ${d.cancel ? `<span class="hotel-badge badge-cancel">⚠ do ${d.cancel}</span>` : ''}
                                            ${HOTEL_INFO[d.day]?.meals === 'breakfast' ? '<span class="hotel-badge badge-breakfast">🍳 Snídaně</span>' : ''}
                                            ${HOTEL_INFO[d.day]?.meals === 'half-board' ? '<span class="hotel-badge badge-halfboard">🍽️ Polopenze</span>' : ''}
                                            ${HOTEL_INFO[d.day]?.bonus ? `<span class="hotel-badge badge-bonus">★ ${HOTEL_INFO[d.day].bonus}</span>` : ''}
                                        </div>
                                    </div>
                                    <div style="text-align:right">
                                        ${d.price ? `<div class="price">${d.price}</div>` : ''}
                                    </div>
                                </div>
                            </div>
                            ${d.pois && d.pois.length > 0 ? `
                            <div class="detail-section" style="grid-column: 1 / -1;">
                                <div class="detail-title">📍 Místa</div>
                                <div class="poi-list">
                                    ${d.pois.map(poi => `<a href="https://www.google.com/maps/search/?api=1&query=${poi.coords[0]},${poi.coords[1]}" target="_blank" class="poi-link">📍 ${poi.name}</a>`).join('')}
                                </div>
                            </div>
                            ` : ''}
                            ${DAY_TASKS[d.day] ? `
                            <div class="detail-section" style="grid-column: 1 / -1;">
                                <div class="detail-title">⚡ Úkoly dne</div>
                                <div class="day-tasks-list">
                                    ${DAY_TASKS[d.day].map((task, idx) => `<div class="day-task-item" data-daytask="${d.day}-${idx}"><div class="day-task-cb"></div><span>${task}</span></div>`).join('')}
                                </div>
                            </div>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `;
        }).join('');

        container.querySelectorAll('.day-head').forEach(head => {
            head.addEventListener('click', () => {
                head.parentElement.classList.toggle('expanded');
            });
        });

        // Day task checkboxes
        const dayTasksState = JSON.parse(localStorage.getItem('japan2026_daytasks') || '{}');
        container.querySelectorAll('.day-task-item').forEach(item => {
            const taskId = item.dataset.daytask;
            if (dayTasksState[taskId]) {
                item.classList.add('done');
                item.querySelector('.day-task-cb').classList.add('done');
            }
            item.addEventListener('click', () => {
                const cb = item.querySelector('.day-task-cb');
                item.classList.toggle('done');
                cb.classList.toggle('done');
                const state = JSON.parse(localStorage.getItem('japan2026_daytasks') || '{}');
                state[taskId] = item.classList.contains('done');
                localStorage.setItem('japan2026_daytasks', JSON.stringify(state));
            });
        });
    }

    // Search inputs (desktop and mobile)
    function handleSearch(q) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.day-card').forEach(card => {
            const text = card.textContent.toLowerCase();
            card.classList.toggle('hidden', q && !text.includes(q));
        });
        applyFilters();
    }

    const searchInput = document.getElementById('search');
    const searchMobile = document.getElementById('searchMobile');

    if (searchInput) {
        searchInput.addEventListener('input', () => handleSearch(searchInput.value.toLowerCase()));
    }
    if (searchMobile) {
        searchMobile.addEventListener('input', () => handleSearch(searchMobile.value.toLowerCase()));
    }

    // Hamburger menu dropdown
    const menuBtn = document.getElementById('menuBtn');
    const menuDropdown = document.getElementById('menuDropdown');

    menuBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        menuDropdown.classList.toggle('open');
    });

    document.addEventListener('click', (e) => {
        if (!menuDropdown.contains(e.target) && e.target !== menuBtn) {
            menuDropdown.classList.remove('open');
        }
    });

    // Filter buttons (toggle)
    function applyFilters() {
        const activeFilters = [];
        document.querySelectorAll('.filter-btn[data-filter].active').forEach(b => {
            activeFilters.push(b.dataset.filter);
        });

        // Apply to day cards
        document.querySelectorAll('.day-card').forEach(card => {
            if (activeFilters.length === 0) {
                card.classList.remove('hidden');
            } else {
                const tags = card.dataset.tags || '';
                const matches = activeFilters.some(f => tags.indexOf(f) !== -1);
                if (matches) {
                    card.classList.remove('hidden');
                } else {
                    card.classList.add('hidden');
                }
            }
        });

        // Apply to calendar days
        document.querySelectorAll('.calendar-day[data-tags]').forEach(day => {
            if (activeFilters.length === 0) {
                day.classList.remove('dimmed');
            } else {
                const tags = day.dataset.tags || '';
                const matches = activeFilters.some(f => tags.indexOf(f) !== -1);
                day.classList.toggle('dimmed', !matches);
            }
        });
    }

    document.querySelectorAll('.filter-btn[data-filter]').forEach(btn => {
        btn.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            this.classList.toggle('active');
            applyFilters();
        });
    });

    // Modal handlers (tasks)
    document.querySelectorAll('[data-modal="tasks"]').forEach(btn => {
        btn.addEventListener('click', () => {
            if (menuDropdown) menuDropdown.classList.remove('open');
            document.getElementById('taskModal').classList.add('visible');
        });
    });
    document.getElementById('closeTaskModal').addEventListener('click', () => {
        document.getElementById('taskModal').classList.remove('visible');
    });
    document.getElementById('taskModal').addEventListener('click', (e) => {
        if (e.target.id === 'taskModal') {
            document.getElementById('taskModal').classList.remove('visible');
        }
    });

    // View modal handlers
    function renderHotels() {
        let total = 0;
        const hotels = DAYS.filter(d => d.hotel && d.hotel !== '–' && d.hotel !== 'V letadle' && d.hotel !== 'Letiště / let').map(d => {
            const num = parseFloat((d.price || '').replace(' EUR', '').replace('EUR', ''));
            if (!isNaN(num)) total += num;
            const info = HOTEL_INFO[d.day] || {};
            const providerClass = {
                'Trip': 'badge-trip', 'Agoda': 'badge-agoda', 'Booking': 'badge-booking',
                'JAPANiCAN': 'badge-japanican', 'IKYU': 'badge-ikyu', 'Revolut': 'badge-revolut', 'Hotel Web': 'badge-hotelweb'
            }[info.provider] || '';
            let badges = '';
            if (info.provider) badges += `<span class="hotel-badge ${providerClass}" style="font-size:0.6rem;">${info.provider}</span> `;
            if (info.payment === 'paid') badges += '<span class="hotel-badge badge-paid" style="font-size:0.6rem;">✓ Paid</span> ';
            if (info.payment === 'on-site') badges += '<span class="hotel-badge badge-onsite" style="font-size:0.6rem;">$ On-site</span> ';
            if (d.cancel) badges += `<span class="hotel-badge badge-cancel" style="font-size:0.6rem;">⚠ ${d.cancel}</span> `;
            if (info.meals) badges += `<span class="hotel-badge badge-breakfast" style="font-size:0.6rem;">${info.meals === 'breakfast' ? '🍳' : '🍽️'}</span> `;
            return { date: d.date.replace('.2026', ''), hotel: d.hotel, price: d.price || '', badges };
        });
        document.getElementById('hotelsContent').innerHTML = `
            ${hotels.map(h => `
                <div class="view-item" style="flex-direction:column;align-items:flex-start;gap:4px;">
                    <div style="display:flex;justify-content:space-between;width:100%;">
                        <strong style="color:#fef08a;">${h.date}</strong>
                        <span class="view-item-price">${h.price}</span>
                    </div>
                    <div style="font-size:0.8rem;color:#fff;">${h.hotel}</div>
                    <div>${h.badges}</div>
                </div>
            `).join('')}
            <div class="view-total">
                <span>Celkem</span>
                <span class="view-item-price">${Math.round(total)} EUR</span>
            </div>
        `;
    }

    function renderContacts() {
        document.getElementById('contactsContent').innerHTML = CONTACTS.map(c => `
            <div class="view-item" style="flex-direction:column;align-items:flex-start;gap:4px;">
                <div style="display:flex;justify-content:space-between;width:100%;">
                    <strong style="color:#fff;">${c.name}</strong>
                    <span class="view-item-date">${c.when}</span>
                </div>
                <span style="font-size:0.75rem;color:rgba(255,255,255,0.7);">${c.note}</span>
            </div>
        `).join('');
    }

    function renderTransport() {
        const flights = DAYS.filter(d => d.tags.includes('flight'));
        const cars = DAYS.filter(d => d.tags.includes('car'));
        document.getElementById('transportContent').innerHTML = `
            <div class="view-section">
                <h3>✈️ Lety</h3>
                ${flights.map(d => `<div class="view-item"><span>${d.date.replace('.2026', '')} ${d.title}</span></div>`).join('')}
            </div>
            <div class="view-section">
                <h3>🚗 Auto</h3>
                ${cars.map(d => `<div class="view-item"><span>${d.date.replace('.2026', '')} ${LOCATIONS[d.day]}</span></div>`).join('')}
            </div>
            <div class="view-section">
                <h3>⛴️ Ferry</h3>
                <div class="view-item"><span>8.10. Yawatahama → Beppu (13:00-15:50)</span></div>
                <div class="view-item"><span>16.10. Kumamoto → Shimabara (09:25)</span></div>
            </div>
        `;
    }

    function getHoClass(dayData) {
        if (!dayData.tags.includes('ho')) return '';
        let hoHours = 8;
        if (dayData.timeline) {
            const hoEntry = dayData.timeline.find(t => t.text && t.text.includes('HOME OFFICE'));
            if (hoEntry && hoEntry.time) {
                const match = hoEntry.time.match(/(\d+):00[–-](\d+):00/);
                if (match) hoHours = parseInt(match[2]) - parseInt(match[1]);
            }
        }
        if (hoHours >= 8) return 'ho-full';
        if (hoHours <= 4) return 'ho-third';
        return 'ho-half';
    }

    function renderCalendar(targetId) {
        const today = new Date();
        const todayStr = `${today.getDate()}.${today.getMonth()+1}.${today.getFullYear()}`;

        const daysByDate = {};
        DAYS.forEach(d => { daysByDate[d.date] = d; });

        const months = [
            { name: 'September', year: 2026, month: 8, startDay: 18, endDay: 30 },
            { name: 'October', year: 2026, month: 9, startDay: 1, endDay: 31 },
            { name: 'November', year: 2026, month: 10, startDay: 1, endDay: 9 }
        ];

        let html = '';
        months.forEach(m => {
            html += `<div class="calendar-month">${m.name}</div>`;
            html += '<div class="calendar-grid">';
            html += ['M','T','W','T','F','S','S'].map(d => `<div class="calendar-header">${d}</div>`).join('');

            const firstDate = new Date(m.year, m.month, m.startDay);
            let dayOfWeek = (firstDate.getDay() + 6) % 7;

            for (let i = 0; i < dayOfWeek; i++) {
                html += '<div class="calendar-day empty"></div>';
            }

            for (let day = m.startDay; day <= m.endDay; day++) {
                const dateStr = `${day}.${m.month + 1}.${m.year}`;
                const dayData = daysByDate[dateStr];
                if (!dayData) continue;

                const date = new Date(m.year, m.month, day);
                const isWeekend = date.getDay() === 0 || date.getDay() === 6;
                const isHO = dayData.tags.includes('ho');
                const isToday = dateStr === todayStr;

                let cls = 'calendar-day';
                if (isWeekend) cls += ' weekend';
                else cls += ' weekday';
                if (isHO) cls += ' ' + getHoClass(dayData);
                if (isToday) cls += ' today';

                html += `<div class="${cls}" data-daynum="${dayData.day}" data-tags="${dayData.tags.join(' ')}">${day}</div>`;
            }
            html += '</div>';
        });

        const container = document.getElementById(targetId);
        container.innerHTML = html;

        container.querySelectorAll('.calendar-day[data-daynum]').forEach(el => {
            el.addEventListener('click', () => {
                const dayNum = el.dataset.daynum;
                const calModal = document.getElementById('calendarModal');
                if (calModal) calModal.classList.remove('visible');
                const card = document.getElementById('day-' + dayNum);
                if (card) {
                    const headerHeight = document.querySelector('header').offsetHeight;
                    const cardTop = card.getBoundingClientRect().top + window.pageYOffset - headerHeight - 16;
                    window.scrollTo({ top: cardTop, behavior: 'smooth' });
                    card.classList.add('expanded');
                }
            });
        });
    }

    document.querySelectorAll('[data-modal="calendar"]').forEach(btn => {
        btn.addEventListener('click', () => {
            if (menuDropdown) menuDropdown.classList.remove('open');
            renderCalendar('calendarContent');
            applyFilters(); // Apply current filters to modal calendar
            document.getElementById('calendarModal').classList.add('visible');
        });
    });

    // Render sidebar calendar on desktop
    if (document.getElementById('sidebarCalendar')) {
        renderCalendar('sidebarCalendar');
    }

    document.querySelectorAll('[data-view]').forEach(btn => {
        btn.addEventListener('click', () => {
            menuDropdown.classList.remove('open');
            const view = btn.dataset.view;
            if (view === 'hotels') { renderHotels(); document.getElementById('hotelsModal').classList.add('visible'); }
            if (view === 'contacts') { renderContacts(); document.getElementById('contactsModal').classList.add('visible'); }
            if (view === 'transport') { renderTransport(); document.getElementById('transportModal').classList.add('visible'); }
        });
    });

    document.querySelectorAll('[data-action]').forEach(btn => {
        btn.addEventListener('click', () => {
            menuDropdown.classList.remove('open');
            const action = btn.dataset.action;
            if (action === 'weather') {
                if (!OWM_API_KEY) {
                    const key = prompt('Zadej OpenWeatherMap API klíč (zdarma na openweathermap.org):');
                    if (key) {
                        localStorage.setItem('owm_api_key', key);
                        location.reload();
                    }
                } else {
                    updateAllWeather();
                }
            }
        });
    });

    document.querySelectorAll('[data-close]').forEach(btn => {
        btn.addEventListener('click', () => {
            document.getElementById(btn.dataset.close).classList.remove('visible');
        });
    });

    document.querySelectorAll('.task-modal-overlay').forEach(modal => {
        modal.addEventListener('click', (e) => {
            if (e.target === modal) modal.classList.remove('visible');
        });
    });

    // Countdown - vintage digital style with rolling animation
    function updateCountdown(animate = false) {
        const tripStart = new Date('2026-09-18');
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        tripStart.setHours(0, 0, 0, 0);
        const diff = Math.round((tripStart - today) / (1000 * 60 * 60 * 24));
        const el = document.getElementById('countdown');
        el.classList.remove('before', 'after', 'zero');

        let sign = '';
        let value = 0;
        let colorClass = '';

        if (diff > 0) {
            sign = '-';
            value = diff;
            colorClass = 'before';
        } else if (diff === 0) {
            sign = '';
            value = 0;
            colorClass = 'zero';
        } else if (diff >= -53) {
            sign = '+';
            value = Math.abs(diff);
            colorClass = 'after';
        } else {
            el.innerHTML = '';
            return;
        }

        el.classList.add(colorClass);
        const digits = String(value).padStart(3, '0').split('');

        // Build HTML with digit wrappers
        let html = `<span>${sign}</span>`;
        digits.forEach((d, i) => {
            html += `<div class="digit-wrapper"><div class="digit-roll" id="cd-d${i}">`;
            for (let n = 9; n >= 0; n--) {
                html += `<span>${n}</span>`;
            }
            html += '</div></div>';
        });
        el.innerHTML = html;

        // Animate rolling
        if (animate) {
            digits.forEach((d, i) => {
                const wrapper = document.getElementById('cd-d' + i);
                const targetNum = parseInt(d);
                const offset = (9 - targetNum) * 1.3;

                wrapper.style.transform = 'translateY(0)';
                setTimeout(() => {
                    wrapper.style.transition = `transform ${0.8 + i * 0.25}s cubic-bezier(0.2, 0.8, 0.2, 1)`;
                    wrapper.style.transform = `translateY(-${offset}em)`;
                }, 100 + i * 150);
            });
        } else {
            // No animation - just set final position
            digits.forEach((d, i) => {
                const wrapper = document.getElementById('cd-d' + i);
                const targetNum = parseInt(d);
                const offset = (9 - targetNum) * 1.3;
                wrapper.style.transform = `translateY(-${offset}em)`;
            });
        }
    }

    renderTasks();
    renderDays();
    updateCountdown(true); // Animate on page load

    // Scroll to current day on page load
    function scrollToToday() {
        const tripStart = new Date('2026-09-18');
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        tripStart.setHours(0, 0, 0, 0);
        const diff = Math.round((today - tripStart) / (1000 * 60 * 60 * 24));

        // Only scroll if we're within the trip dates (day 1-53)
        if (diff >= 0 && diff < 53) {
            const dayNum = diff + 1; // Day 1 = Sept 18
            const card = document.getElementById('day-' + dayNum);
            if (card) {
                const headerHeight = document.querySelector('header').offsetHeight;
                const cardTop = card.getBoundingClientRect().top + window.pageYOffset - headerHeight - 16;
                window.scrollTo({ top: cardTop, behavior: 'auto' });
            }
        }
    }
    scrollToToday();
    </script>
