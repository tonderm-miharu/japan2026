<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
    <defs>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    <rect width="180" height="180" fill="#1a1a2e"/>
    <text x="90" y="95" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" letter-spacing="4" fill="#60a5fa" filter="url(#glow)">JAPAN</text>
    <rect x="35" y="112" width="110" height="4" fill="#ef4444" rx="2"/>
</svg>
